name: Crates Publish

on:
  workflow_dispatch:

# This job only reads repository content.  Without an explicit permissions
# block the job inherits the repository's default token scope, which on older
# repositories may be read/write across every scope the token carries.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.10.0
      - name: Build check
        working-directory: sdk/rust
        run: cargo build
      - name: Publish Rust crate
        working-directory: sdk/rust
        # cargo reads CARGO_REGISTRY_TOKEN from the environment automatically;
        # no --token flag is required.  The earlier form used
        # `--token ${{ secrets.CARGO_REGISTRY_TOKEN }}`, which interpolated the
        # raw token value into the shell command text before bash parsed it.
        # That made the value visible in the process listing and in runner logs,
        # and any shell metacharacter in the token would have been executed as a
        # shell command.  Passing the token only through env: keeps the value
        # out of the command-line text entirely.
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
