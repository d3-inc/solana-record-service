[package]
name = "solana-record-service-client"
version = "0.1.0"
edition = "2021"
description = "Rust client for the Solana Record Service"
license = "MIT"
repository = "https://github.com/solana-foundation/solana-record-service"

[lib]
name = "solana_record_service_client"

[features]
default = []
anchor = ["dep:anchor-lang"]
anchor-idl-build = ["dep:anchor-lang", "anchor-lang/idl-build"]
serde = ["dep:serde", "dep:serde_with", "kaigan/serde"]
fetch = ["dep:solana-client", "dep:solana-sdk"]

[dependencies]
kaigan = ">=0.2.6"
borsh = "^0.10"
solana-program = "2.3.0"
solana-instruction = "2.3.0"
solana-pubkey = "2.3.0"
solana-account-info = "2.3.0"
solana-program-entrypoint = "2.3.0"
solana-cpi = "2.2.1"
sha3 = "0.10"
idna = "0.5"

[dev-dependencies]
hex-literal = "0.4"

[dependencies.solana-client]
version = "2.3.0"
optional = true

[dependencies.solana-sdk]
version = "2.3.0"
optional = true

[dependencies.anchor-lang]
version = "0.31"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.serde_with]
version = "3.0"
optional = true
